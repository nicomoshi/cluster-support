<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cluster</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090909;
      --fg: #f3eee7;
      --muted: #b7aea2;
      --line: #312d28;
      --accent: #d7a85b;
    }
    body {
      margin: 0;
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    main {
      width: min(760px, calc(100% - 40px));
      margin: 0 auto;
      padding: 72px 0;
    }
    h1 {
      font-size: clamp(40px, 9vw, 76px);
      line-height: 0.95;
      margin: 0 0 20px;
      letter-spacing: 0;
    }
    p {
      color: var(--muted);
      max-width: 620px;
    }
    a {
      color: var(--accent);
    }
    nav {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 34px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <main>
    <h1>Cluster</h1>
    <p>Cluster is a native Hermes Agent client for iPhone, iPad, and Mac. It connects to a Hermes gateway that you configure and control.</p>
    <nav>
      <a href="./support.html">Support</a>
      <a href="./privacy.html">Privacy Policy</a>
    </nav>
  </main>
</body>
</html>
